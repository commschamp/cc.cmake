name: Github Actions Build

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'

env:
  CC_CMAKE_CONFIG: config/All.cmake
  WIN_BOOST_VERSION: "1.87.0"
  WIN_BOOST_DIR: "C:/local/boost_1_87_0"
  WIN_OPENSSL_VERSION: "4.0.2"

jobs:
  build_gcc_ubuntu_24_04:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        type: [Debug, Release, MinSizeRel]
        cc_ver: [9, 10, 11, 12, 13]
        cpp: [17, 20]
        qt_ver: [5, 6]

    steps:
    - uses: actions/checkout@v4

    - name: Prepare Install
      run: sudo apt-get update --fix-missing

    - name: Install Packages
      run: sudo apt install libboost-all-dev qtbase5-dev qt6-base-dev libqt${{matrix.qt_ver}}serialport${{matrix.qt_ver}}-dev libssl-dev gcc-${{matrix.cc_ver}} g++-${{matrix.cc_ver}}

    - name: Create Build Environment
      run: cmake -E make_directory ${{runner.workspace}}/build

    - name: Configure CMake
      shell: bash
      working-directory: ${{runner.workspace}}/build
      run: |
        cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=${{matrix.type}} -DCMAKE_INSTALL_PREFIX=install \
          -DCMAKE_CXX_STANDARD=${{matrix.cpp}} -DCMAKE_PROJECT_INCLUDE=${{env.CC_CMAKE_CONFIG}} -DOPT_QT_MAJOR_VERSION=${{matrix.qt_ver}}
      env:
        CC: gcc-${{matrix.cc_ver}}
        CXX: g++-${{matrix.cc_ver}}

    - name: Build Target
      working-directory: ${{runner.workspace}}/build
      shell: bash
      run: cmake --build . --config ${{matrix.type}}
      env:
        VERBOSE: 1

  build_gcc_ubuntu_26_04:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        type: [Debug, Release, MinSizeRel]
        cc_ver: [14, 15]
        cpp: [17, 20, 23]
        qt_ver: [6]

    steps:
    - uses: actions/checkout@v4

    - name: Prepare Install
      run: sudo apt-get update --fix-missing

    - name: Install Packages
      run: sudo apt install libboost-all-dev qt${{matrix.qt_ver}}-base-dev qt${{matrix.qt_ver}}-serialport-dev libssl-dev gcc-${{matrix.cc_ver}} g++-${{matrix.cc_ver}}

    - name: Create Build Environment
      run: cmake -E make_directory ${{runner.workspace}}/build

    - name: Configure CMake
      shell: bash
      working-directory: ${{runner.workspace}}/build
      run: |
        cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=${{matrix.type}} -DCMAKE_INSTALL_PREFIX=install \
          -DCMAKE_CXX_STANDARD=${{matrix.cpp}} -DCMAKE_PROJECT_INCLUDE=${{env.CC_CMAKE_CONFIG}} -DOPT_QT_MAJOR_VERSION=${{matrix.qt_ver}}
      env:
        CC: gcc-${{matrix.cc_ver}}
        CXX: g++-${{matrix.cc_ver}}

    - name: Build Target
      working-directory: ${{runner.workspace}}/build
      shell: bash
      run: cmake --build . --config ${{matrix.type}}
      env:
        VERBOSE: 1

    - name: Build Target
      working-directory: ${{runner.workspace}}/build
      shell: bash
      run: cmake --build . --config ${{matrix.type}}
      env:
        VERBOSE: 1

  build_clang_ubuntu_24_04:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        type: [Debug, Release, MinSizeRel]
        cc_ver: [14, 15, 16]
        cpp: [17, 20]
        qt_ver: [5, 6]
        exclude:
          - cc_ver: 14
            cpp: 20
          - cc_ver: 15
            cpp: 20

    steps:
    - uses: actions/checkout@v4

    - name: Prepare Install
      run: sudo apt-get update --fix-missing

    - name: Install Packages
      run: sudo apt install libboost-all-dev qtbase5-dev qt6-base-dev libqt${{matrix.qt_ver}}serialport${{matrix.qt_ver}}-dev libssl-dev clang-${{matrix.cc_ver}}

    - name: Create Build Environment
      run: cmake -E make_directory ${{runner.workspace}}/build

    - name: Configure CMake
      shell: bash
      working-directory: ${{runner.workspace}}/build
      run: |
        cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=${{matrix.type}} -DCMAKE_INSTALL_PREFIX=install \
          -DCMAKE_CXX_STANDARD=${{matrix.cpp}} -DCMAKE_PROJECT_INCLUDE=${{env.CC_CMAKE_CONFIG}} -DOPT_QT_MAJOR_VERSION=${{matrix.qt_ver}}
      env:
        CC: clang-${{matrix.cc_ver}}
        CXX: clang++-${{matrix.cc_ver}}

    - name: Build Target
      working-directory: ${{runner.workspace}}/build
      shell: bash
      run: cmake --build . --config ${{matrix.type}}
      env:
        VERBOSE: 1

  build_clang_ubuntu_26_04:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        type: [Debug, Release, MinSizeRel]
        cc_ver: [17, 18, 19, 20, 21, 22]
        cpp: [17, 20, 23]
        qt_ver: [6]
        exclude:
          - cc_ver: 17
            cpp: 23

    steps:
    - uses: actions/checkout@v4

    - name: Prepare Install
      run: sudo apt-get update --fix-missing

    - name: Install Packages
      run: sudo apt install libboost-all-dev qt${{matrix.qt_ver}}-base-dev qt${{matrix.qt_ver}}-serialport-dev libssl-dev clang-${{matrix.cc_ver}}

    - name: Create Build Environment
      run: cmake -E make_directory ${{runner.workspace}}/build

    - name: Configure CMake
      shell: bash
      working-directory: ${{runner.workspace}}/build
      run: |
        cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=${{matrix.type}} -DCMAKE_INSTALL_PREFIX=install \
          -DCMAKE_CXX_STANDARD=${{matrix.cpp}} -DCMAKE_PROJECT_INCLUDE=${{env.CC_CMAKE_CONFIG}} -DOPT_QT_MAJOR_VERSION=${{matrix.qt_ver}}
      env:
        CC: clang-${{matrix.cc_ver}}
        CXX: clang++-${{matrix.cc_ver}}

    - name: Build Target
      working-directory: ${{runner.workspace}}/build
      shell: bash
      run: cmake --build . --config ${{matrix.type}}
      env:
        VERBOSE: 1        

  build_msvc_2022:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        type: [Debug, Release]
        arch: [x64]
        cpp: [17, 20]
        qt_ver: [5, 6]

    steps:
    - uses: actions/checkout@v4

    - name: Create Build Environment
      run: cmake -E make_directory ${{runner.workspace}}/build

    - name: Install Boost
      shell: cmd
      run: |
        choco install boost-msvc-14.3 --version=${{env.WIN_BOOST_VERSION}}
        echo BOOST_DIR=${{env.WIN_BOOST_DIR}}/lib64-msvc-14.3/cmake >>%GITHUB_ENV%

    - name: Install OpenSSL
      if: matrix.arch == 'x64'
      shell: cmd
      run: |
        choco install openssl --version=${{env.WIN_OPENSSL_VERSION}}

    - name: Install Qt (sets QT_ROOT_DIR)
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ matrix.qt_ver == 5 && '5.15.*' || '6.8.*' }}
        cache: true

    - name: Configure CMake
      shell: cmd
      working-directory: ${{runner.workspace}}/build
      run: |
        cmake %GITHUB_WORKSPACE% -A ${{matrix.arch}} -DCMAKE_BUILD_TYPE=${{matrix.type}} -DCMAKE_INSTALL_PREFIX=install ^
          -DCMAKE_PREFIX_PATH="%QT_ROOT_DIR%;%BOOST_DIR%" -DCMAKE_CXX_STANDARD=${{matrix.cpp}} ^
          -DCMAKE_POLICY_DEFAULT_CMP0167=NEW ^
          -DCMAKE_PROJECT_INCLUDE=${{env.CC_CMAKE_CONFIG}} -DOPT_QT_MAJOR_VERSION=${{matrix.qt_ver}} ^
          -DOPT_CC_UBLOX_PROTOCOL_CC_TOOLS_PLUGIN=OFF

    - name: Build Target
      working-directory: ${{runner.workspace}}/build
      shell: cmd
      run: cmake --build . --config ${{matrix.type}}
      env:
        VERBOSE: 1

  build_msvc_2026:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        type: [Debug, Release]
        arch: [x64]
        cpp: [17, 20, 23]
        qt_ver: [5, 6]
        exclude:
          - cpp: 20
            qt_ver: 5
          - cpp: 23
            qt_ver: 5

    steps:
    - uses: actions/checkout@v4

    - name: Create Build Environment
      run: cmake -E make_directory ${{runner.workspace}}/build

    - name: Install Boost
      shell: cmd
      run: |
        choco install boost-msvc-14.3 --version=${{env.WIN_BOOST_VERSION}}
        echo BOOST_DIR=${{env.WIN_BOOST_DIR}}/lib64-msvc-14.3/cmake >>%GITHUB_ENV%

    - name: Install OpenSSL
      if: matrix.arch == 'x64'
      shell: cmd
      run: |
        choco install openssl --version=${{env.WIN_OPENSSL_VERSION}}

    - name: Install Qt (sets QT_ROOT_DIR)
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ matrix.qt_ver == 5 && '5.15.*' || '6.8.*' }}
        cache: true

    - name: Configure CMake
      shell: cmd
      working-directory: ${{runner.workspace}}/build
      run: |
        cmake %GITHUB_WORKSPACE% -A ${{matrix.arch}} -DCMAKE_BUILD_TYPE=${{matrix.type}} -DCMAKE_INSTALL_PREFIX=install ^
          -DCMAKE_PREFIX_PATH="%QT_ROOT_DIR%;%BOOST_DIR%" -DCMAKE_CXX_STANDARD=${{matrix.cpp}} ^
          -DCMAKE_POLICY_DEFAULT_CMP0167=NEW ^
          -DCMAKE_PROJECT_INCLUDE=${{env.CC_CMAKE_CONFIG}} -DOPT_QT_MAJOR_VERSION=${{matrix.qt_ver}} ^
          -DOPT_CC_UBLOX_PROTOCOL_CC_TOOLS_PLUGIN=OFF

    - name: Build Target
      working-directory: ${{runner.workspace}}/build
      shell: cmd
      run: cmake --build . --config ${{matrix.type}}
      env:
        VERBOSE: 1
